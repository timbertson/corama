syntax = "proto3";
package streamdsl;

import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";

// CoramaApi is a uniform API implemented by all nodes.
// Requests may land on any node, and will be internally
// forwarded to the active leader.
// Requests may still be rejected during leadership changes,
// this forwarding API will not retry internally (that's up to the client).
service Corama {
	rpc Append(AppendRequest) returns (Response);
	rpc Query(QueryRequest) returns (Response);
}

// CoramaNode implementations are identity-aware. Requests are
// sent to a specific instance, and will be rejected if that instance
// is not the active leader for that partition / task.
service CoramaInstance {
	rpc Append(AppendRequest) returns (Response);
	rpc Query(QueryRequest) returns (Response);
	
	// internal
	rpc Continue(ContinueRequest) returns (google.protobuf.Empty);
	rpc Notify(NotifyRequest) returns (google.protobuf.Empty);
}

message AppendRequest {
	string depot = 1;
	bytes value = 2;
	google.protobuf.Int32Value partition = 3;
}

message QueryRequest {
	string query = 1;
	bytes value = 2;
	google.protobuf.Int32Value partition = 3;
}

message NotifyRequest {
	int64 evalId = 1;
	int64 edge = 2;
	google.protobuf.BytesValue value = 3; // optional, return value
}

message Response {
	google.protobuf.BytesValue value = 1;
}

message ErrorDetail {
	// to be used via https://google.aip.dev/193#error_model
}

message Ack {
	int64 id = 1;
}

message DbWrite {
	bytes key = 1;
	google.protobuf.BytesValue value = 2; // can be null for a delete
}

message DbReplication {
	int32 producerId = 1; // which instance produced this message (the current leader)
	string name = 2; // which DB this applies to
	int32 dbPartition = 3; // the partition of the DB ()
	repeated DbWrite writes = 4;
}

// -- simple protobuf wrapper types

message RepeatedBytes {
	repeated bytes value = 1;
}

message Either {
	oneof value {
		bytes left = 1;
		bytes right = 2;
	}
}

// -- internal API

message ContinueRequest {
	int32 taskId = 1;
	int32 topologyId = 2;
	int32 afterNode = 4;
	EvalOrigin origin = 5;
	repeated PartitionEnvs partitions = 6;
}

message PartitionEnvs {
	int32 partitionId = 1;
	int64 edgeId = 2;
	repeated Env envs = 3;
}

message Env {
	repeated EnvItem items = 1;
}

message EnvItem {
	int32 varId = 1;
	bytes value = 2;
}

message EvalOrigin {
	string instanceId = 1;
	int64 evalId = 2;
}
