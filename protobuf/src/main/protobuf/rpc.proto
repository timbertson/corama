// 	int32 targetPartition = 3;
// 	int32 topology = 4;
// 	repeated Continuation items = 5;
// }

message Ack {
	int64 id = 1;
}

// message RpcAddress {
// 	string host = 1;
// 	int32 port = 2;
// }

message BytesValue {
	bytes bytes = 1;
}

message DbWrite {
	bytes key = 1;
	BytesValue value = 2; // can be null for a delete
}

message DbReplication {
	int32 producerId = 1; // which instance produced this message (the current leader)
	string name = 2; // which DB this applies to
	int32 dbPartition = 3; // the partition of the DB ()
	repeated DbWrite writes = 4;
}

// service Exchange {
// 	rpc Recv(ContinuationBatch) returns (Empty);
// 	rpc Ack(streamdsl.Ack) returns (Empty);
// }

// -- simple protobuf wrapper types

message RepeatedBytes {
	repeated bytes value = 1;
}

message Either {
	oneof value {
		bytes left = 1;
		bytes right = 2;
	}
}

// -- internal API

message ContinueRequest {
	int32 taskId = 1;
	int32 topologyId = 2;
	int32 afterNode = 3;
	int64 edgeId = 4;
	EvalOrigin origin = 5;
	PartitionBatch envs = 6;
}

message PartitionBatch {
	map<int32, EnvBatch> partitions = 1;
}

message EnvBatch {
	// key is VarId
	map<int32, bytes> values = 1;
}

message EvalOrigin {
	string instanceId = 1;
	int64 evalId = 2;
}

message Request {
	string id = 1; // destination (depot name / query name)
	bytes value = 2;
}

message Response {
	oneof value {
		bytes success = 1;
		bytes failure = 2;
	}
}
